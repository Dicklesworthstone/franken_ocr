name: Apple source contract

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/apple.yml"]

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    # FocrCore.xcframework is generated and intentionally not committed. This
    # lane validates native source and project generation without claiming a
    # Rust-linked app build.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Apple project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Parse every tracked Swift target
        working-directory: ios
        run: xcrun swiftc -parse $(git ls-files '*.swift')
      - name: Validate property lists and privacy manifest
        working-directory: ios
        run: |
          plutil -lint Sources/Info.plist
          plutil -lint Sources/PrivacyInfo.xcprivacy
