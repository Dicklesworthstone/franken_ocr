<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>franken_ocr — reset</title>
<style>
  body { margin: 0; background: #0d1117; color: #e6edf3;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: grid; place-items: center; min-height: 100vh; }
  main { max-width: 32rem; padding: 2rem; }
  button { padding: 0.6rem 1.2rem; border-radius: 8px; border: 1px solid #2d333b;
           background: #10b981; color: #04110b; font: inherit; font-weight: 600; cursor: pointer; }
  .out { margin-top: 1rem; color: #9aa7b3; font-size: 0.9rem; white-space: pre-line; }
  a { color: #34d399; }
</style>
</head>
<body>
<main>
  <h1>Reset franken_ocr</h1>
  <p>This page loads <strong>no WebAssembly</strong> — it exists so a crashing engine
  can't take the escape hatch down with it. It wipes the cached model bytes and the
  crash breadcrumbs, then you can <a href="./">go back</a> and start clean.</p>
  <button id="wipe">Wipe caches</button>
  <div class="out" id="out"></div>
</main>
<script>
  document.getElementById("wipe").addEventListener("click", async () => {
    const out = [];
    try {
      for (const name of await caches.keys()) {
        await caches.delete(name);
        out.push(`deleted cache "${name}"`);
      }
      localStorage.removeItem("focr-last-stage");
      out.push("cleared crash breadcrumbs");
      out.push("done — you can go back now.");
    } catch (e) {
      out.push(`error: ${e}`);
    }
    document.getElementById("out").textContent = out.join("\n");
  });
</script>
</body>
</html>
