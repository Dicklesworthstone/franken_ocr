# focr-wasm — the browser boundary for franken_ocr (the site/pkg source).
#
# Mirrors the proven frankentts `ftts-wasm` shape: a cdylib over the core
# library with `--no-default-features` (no async runtime, no SQL, no signals,
# no mmap, no PDF), byte-based model staging, and a small wasm-bindgen surface
# whose every fallible edge returns `Result<_, JsValue>` — a panic in wasm is
# an opaque `unreachable`, so errors must cross the boundary as values.
[package]
name = "focr-wasm"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "Browser (wasm32) boundary crate for the franken_ocr engine"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
franken_ocr = { path = "..", default-features = false }
# Same major as the library so `image::DynamicImage` is ONE type across the
# boundary; slim decode set (the site sends PNG/JPEG bytes).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "0.2"

[lints.rust]
unsafe_code = "deny"
