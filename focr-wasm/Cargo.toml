# focr-wasm — the browser boundary for franken_ocr (the site/pkg source).
#
# Mirrors the proven frankentts `ftts-wasm` shape: a cdylib over the core
# library with `--no-default-features` (no async runtime, no SQL, no signals,
# no mmap, no PDF), byte-based model staging, and a small wasm-bindgen surface
# whose every fallible edge returns `Result<_, JsValue>` — a panic in wasm is
# an opaque `unreachable`, so errors must cross the boundary as values.
[package]
name = "focr-wasm"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "Browser (wasm32) boundary crate for the franken_ocr engine"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `pdf` (and nothing else from `native`): the playground accepts scanned PDFs,
# rasterized in-wasm by the same src/pdf.rs code the CLI uses. lopdf's
# getrandom-0.4 pull compiles on wasm32 via the library's target-gated
# `wasm_js`-featured getrandom dep (no RUSTFLAGS cfg needed on 0.4).
franken_ocr = { path = "..", default-features = false, features = ["pdf"] }
# Same major as the library so `image::DynamicImage` is ONE type across the
# boundary; slim decode set (the site sends PNG/JPEG bytes).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
js-sys = "0.3"
# Reported thread count comes from rayon itself, not from the build flags — a
# threaded module whose pool never armed must be visible as `threads: 1`.
# Already in the lock graph via franken_ocr/ft-kernel-cpu.
rayon = "1"
serde_json = "1"
wasm-bindgen = "0.2"

# The threaded browser lane (bd-rhk7). OFF by default so `site/pkg` (the serial
# module iOS/WebKit gets) never pulls the shared-memory machinery: sharedness is
# a LINK-TIME property, so the two lanes are two builds, not one build with a
# runtime switch.
#
# `no-bundler` is mandatory for `wasm-bindgen --target web`: it makes the crate's
# JS snippet spawn its workers from a module URL instead of expecting a bundler
# to resolve `new Worker(new URL(...))` at build time.
#
# wasm-bindgen-rayon 1.3.0 requires wasm-bindgen ^0.2.99 (we are on 0.2.126, and
# the wasm-bindgen CLI is pinned to the same 0.2.126) and turns on
# `rayon/web_spin_lock`, which routes rayon-core's spin lock through
# `Atomics.wait` — mandatory on the web, where a spinning worker cannot be
# preempted.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "1.3.0", features = [
    "no-bundler",
], optional = true }

[features]
default = []
# Build the shared-memory/atomics module (site/pkg-threaded). Requires the
# matching RUSTFLAGS + `-Z build-std=std,panic_abort`; see site/build.sh.
threads = ["dep:wasm-bindgen-rayon"]

[lints.rust]
unsafe_code = "deny"
