# xcodegen spec for the FrankenOCR app. The .xcodeproj is GENERATED from this
# file and is gitignored — this is the source of truth, so a project setting is
# reviewable as a diff instead of buried in a pbxproj.
#
#   ios/build-rust.sh          # build FocrCore.xcframework (after any Rust change)
#   cd ios && xcodegen generate
#   open FrankenOCR.xcodeproj
name: FrankenOCR
options:
  bundleIdPrefix: com.frankenocr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: AU8V2Z6NKY
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # The Rust simulator slice is built for aarch64-apple-ios-sim only. An Intel
    # Mac would otherwise try to link an x86_64 simulator binary that does not
    # exist and fail with an inscrutable "undefined symbols" wall.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  FrankenOCR:
    type: application
    platform: iOS
    # Universal. iPad is not an afterthought here: the large models want RAM,
    # and an iPad Pro has both the memory headroom and the screen width for the
    # side-by-side page/transcription layout the phone has to stack.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankenocr.FrankenOCR
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: FrankenOCR.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": FrankenOCR-Mac.entitlements
        # The xcframework sits next to the project.
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "."]
        SUPPORTS_MACCATALYST: true
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: false
        MACCATALYST_USE_NATIVE_DESIGN: true
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          ENABLE_NS_ASSERTIONS: false
    sources:
      - path: Sources
      - path: Shared
      - path: Assets.xcassets
    dependencies:
      # Static library: there is nothing to embed, and embedding it would both
      # bloat the bundle and confuse dyld.
      - framework: FocrCore.xcframework
        embed: false
      - target: FrankenOCRWidgets
        embed: true
        platformFilter: iOS
      - target: FrankenOCRShare
        embed: true
        platformFilter: iOS
  FrankenOCRWidgets:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankenocr.FrankenOCR.Widgets
        PRODUCT_NAME: FrankenOCR Widgets
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        SUPPORTS_MACCATALYST: false
    sources:
      - path: Widget
      - path: Shared
      - path: Sources/PrivacyInfo.xcprivacy
    entitlements:
      path: FrankenOCRWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.frankenocr.FrankenOCR
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: FrankenOCR Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  FrankenOCRShare:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankenocr.FrankenOCR.Share
        PRODUCT_NAME: Recognize with FrankenOCR
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        SUPPORTS_MACCATALYST: false
    sources:
      - path: Share
      - path: Shared
      - path: Sources/PrivacyInfo.xcprivacy
    entitlements:
      path: FrankenOCRShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.frankenocr.FrankenOCR
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Recognize with FrankenOCR
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1

  FrankenOCRTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankenocr.FrankenOCRTests
        GENERATE_INFOPLIST_FILE: true
    sources:
      - path: Tests
    dependencies:
      - target: FrankenOCR
